<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healthy Back Studio (AI assistant demo)</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222}
    header{background:#e6f1ea;padding:48px 24px;text-align:center}
    h1{margin:0 0 8px;color:#2e6b4f}
    main{max-width:720px;margin:32px auto;padding:0 24px}
  </style>
  <script defer src="../widget/widget.js"
          data-endpoint="/api/chat"
          data-title="Healthy Back Studio Assistant"
          data-greeting="Hello, and welcome to Healthy Back Studio! I'm the virtual assistant. What would you like to know?"
          data-color="#2e6b4f"
          data-client="ordinacija"
          data-suggestions="Services and prices|Opening hours|Book an appointment"></script>
</head>
<body>
  <header>
    <h1>Healthy Back Studio</h1>
    <p>Fictional physiotherapy clinic (demo)</p>
  </header>
  <main>
    <p>This is a demo page. Click the chat in the bottom right corner and ask about services, prices or booking.</p>
  </main>
</body>
</html>
