<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Zdrava Leđa (demo AI asistenta)</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222}
    header{background:#e6f1ea;padding:48px 24px;text-align:center}
    h1{margin:0 0 8px;color:#2e6b4f}
    main{max-width:720px;margin:32px auto;padding:0 24px}
  </style>
</head>
<body>
  <header>
    <h1>Studio Zdrava Leđa</h1>
    <p>Izmišljena fizioterapijska ordinacija (demo)</p>
  </header>
  <main>
    <p>Ovo je demo stranica. Klikni na chat u donjem desnom uglu i pitaj za usluge ili zakazivanje termina.</p>
  </main>

  <script src="../widget/widget.js"
          data-endpoint="/api/chat"
          data-title="Asistent Studija Zdrava Leđa"
          data-greeting="Zdravo! Ja sam asistent Studija Zdrava Leđa. Pitajte me o uslugama ili zakazivanju termina."
          data-color="#2e6b4f"
          data-client="ordinacija"></script>
</body>
</html>
