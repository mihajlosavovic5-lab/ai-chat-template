<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Justice Plus Law Office (AI assistant demo)</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222}
    header{background:#e8edf4;padding:48px 24px;text-align:center}
    h1{margin:0 0 8px;color:#1f3a5f}
    main{max-width:720px;margin:32px auto;padding:0 24px}
  </style>
</head>
<body>
  <header>
    <h1>Justice Plus</h1>
    <p>Fictional law office (demo)</p>
  </header>
  <main>
    <p>This is a demo page. Click the chat in the bottom right corner and ask about practice areas, prices or booking a consultation.</p>
  </main>

  <script src="../widget/widget.js"
          data-endpoint="/api/chat"
          data-title="Justice Plus Law Office Assistant"
          data-greeting="Hello! I'm the Justice Plus Law Office assistant. Ask me about practice areas, prices or booking a consultation."
          data-color="#1f3a5f"
          data-client="advokat"></script>
</body>
</html>
