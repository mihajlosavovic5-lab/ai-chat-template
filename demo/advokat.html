<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advokatska kancelarija Pravda Plus (demo AI asistenta)</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222}
    header{background:#e8edf4;padding:48px 24px;text-align:center}
    h1{margin:0 0 8px;color:#1f3a5f}
    main{max-width:720px;margin:32px auto;padding:0 24px}
  </style>
</head>
<body>
  <header>
    <h1>Pravda Plus</h1>
    <p>Izmišljena advokatska kancelarija (demo)</p>
  </header>
  <main>
    <p>Ovo je demo stranica. Klikni na chat u donjem desnom uglu i pitaj za oblasti rada, cene ili zakazivanje konsultacije.</p>
  </main>

  <script src="../widget/widget.js"
          data-endpoint="/api/chat"
          data-title="Asistent kancelarije Pravda Plus"
          data-greeting="Dobar dan! Ja sam asistent kancelarije Pravda Plus. Pitajte me o oblastima rada, cenama ili zakazivanju konsultacije."
          data-color="#1f3a5f"
          data-client="advokat"></script>
</body>
</html>
