<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salon Lena (AI assistant demo)</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222}
    header{background:#fce4ec;padding:48px 24px;text-align:center}
    h1{margin:0 0 8px}
    main{max-width:720px;margin:32px auto;padding:0 24px}
  </style>
  <script defer src="../widget/widget.js"
          data-endpoint="/api/chat"
          data-title="Lena AI"
          data-greeting="Hello! I'm Lena AI. Ask me about prices, opening hours or appointments."
          data-color="#c2185b"
          data-client="salon"></script>
</head>
<body>
  <header>
    <h1>Salon Lena</h1>
    <p>Hair salon in the centre of Demo City</p>
  </header>
  <main>
    <p>This is a demo page. Click the chat in the bottom right corner and ask about prices, opening hours or appointments.</p>
  </main>
</body>
</html>
